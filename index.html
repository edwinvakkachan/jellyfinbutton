<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Control Panel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(0, 0, 0, 0.8);
  color: white;
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 14px;
  backdrop-filter: blur(10px);
  opacity: 0;
  pointer-events: none;
  transition: all 0.4s ease;
  z-index: 1000;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(270deg, #1e3c72, #2a5298, #6a11cb, #2575fc);
      background-size: 800% 800%;
      animation: gradientBG 12s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
      padding: 30px 20px;
      backdrop-filter: blur(10px);
      border-radius: 20px;
    }

    h1 {
      color: white;
      margin-bottom: 25px;
      font-size: clamp(20px, 5vw, 28px);
      letter-spacing: 1px;
    }

    .btn {
      width: 100%;
      padding: 18px;
      font-size: clamp(16px, 4vw, 20px);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      color: white;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    /* Shine animation */
    .btn::after {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      top: -100%;
      left: -100%;
      background: rgba(255,255,255,0.2);
      transform: rotate(45deg);
      transition: 0.6s;
    }

    .btn:hover::after {
      top: 100%;
      left: 100%;
    }

    .status {
      margin-top: 15px;
      color: white;
      font-size: clamp(14px, 3.5vw, 16px);
      opacity: 0.9;
      min-height: 20px;
    }

    /* Small screens (extra optimization) */
    @media (max-width: 480px) {
      .container {
        padding: 25px 15px;
      }

      .btn {
        padding: 16px;
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>🎬 Media Control</h1>
<div id="toast" class="toast"></div>
    <button class="btn" onclick="triggerWebhook()">
      Turn ON Device
    </button>

    <div class="status" id="status"></div>
  </div>

<script>
  let cooldown = 180; // 3 minutes
  let timerInterval = null;
  let remaining = 0;

  const button = document.querySelector('.btn');
  const status = document.getElementById('status');
  const toast = document.getElementById('toast');

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function showToast(message) {
    toast.innerText = message;
    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 3000);
  }

  function startCooldown() {
    button.disabled = true;
    button.style.opacity = "0.6";
    button.innerText = "Please wait...";

    remaining = cooldown;

    timerInterval = setInterval(() => {
      remaining--;

      status.innerText = `⏳ Wait ${formatTime(remaining)}`;

      if (remaining <= 0) {
        clearInterval(timerInterval);
        button.disabled = false;
        button.style.opacity = "1";
        button.innerText = "Turn ON Device";
        status.innerText = "✅ Ready";
      }
    }, 1000);
  }

  async function triggerWebhook() {
    // 🚫 If disabled → show toast instead of alert
    if (button.disabled) {
      showToast(`⏳ Please wait ${formatTime(remaining)}`);
      return;
    }

    status.innerText = "Sending request...";

    try {
      const res = await fetch('/api/turn-on');
      const text = await res.text();
      status.innerText = text;

      showToast("✅ Request sent successfully");
      startCooldown();
      getStatus();

    } catch {
      status.innerText = "Error";
      showToast("❌ Failed to send request");
    }
  }

  async function getStatus() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();

      if (data.state === "on") {
        status.innerText = "🟢 Device is ON";
      } else if (data.state === "off") {
        status.innerText = "🔴 Device is OFF";
      } else {
        status.innerText = "⚪ Unknown";
      }

    } catch {
      status.innerText = "Error fetching status";
    }
  }

  setInterval(getStatus, 5000);
  getStatus();
</script>

</body>
</html>
